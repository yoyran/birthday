<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a2e">
<title>🎂 生日快乐 · 点开有惊喜</title>
<meta name="description" content="点开就弹出「生日快乐」四个大字，还有一首生日快乐歌 🎵">
<meta property="og:type" content="website">
<meta property="og:title" content="🎂 送你一份会唱歌的生日祝福">
<meta property="og:description" content="点开就看到「生日快乐」，还有生日歌在等你 🎵">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #150a26;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------------- 底层舞台 ---------------- */
  .app {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 8%, #5a1a63 0%, #3a1048 34%, #210a37 62%, #120819 100%);
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    will-change: transform, opacity;
  }
  .g1 {
    width: 78vmax; height: 78vmax;
    top: -30vmax; left: -30vmax;
    background: radial-gradient(circle, rgba(255,168,74,.30) 0%, rgba(255,140,40,.10) 42%, rgba(255,120,20,0) 68%);
    animation: breathe 7s ease-in-out infinite;
  }
  .g2 {
    width: 70vmax; height: 70vmax;
    right: -28vmax; bottom: -34vmax;
    background: radial-gradient(circle, rgba(146,110,255,.34) 0%, rgba(120,80,255,.12) 44%, rgba(120,80,255,0) 68%);
    animation: breathe 9s ease-in-out 1.4s infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.13); }
  }

  /* ---------------- 气球 ---------------- */
  .balloon {
    position: absolute;
    bottom: -22vh;
    opacity: 0;
    border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%;
    box-shadow: inset -8px -10px 16px rgba(0,0,0,.20), inset 6px 8px 14px rgba(255,255,255,.35);
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 14vh;
    background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,0));
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) rotate(-7deg); opacity: 0; }
    12%  { opacity: .9; }
    50%  { transform: translate3d(-3vw, -62vh, 0) rotate(5deg); opacity: .9; }
    100% { transform: translate3d(2vw, -130vh, 0) rotate(-5deg); opacity: 0; }
  }

  /* ---------------- 粒子画布 ---------------- */
  #fx {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* ---------------- 卡片内容 ---------------- */
  .card {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 22px;
    text-align: center;
    opacity: 0;
    transition: opacity .5s ease;
  }
  body.play .card { opacity: 1; }

  .cake {
    font-size: 62px;
    line-height: 1;
    margin-bottom: 10px;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,.45));
    animation: bob 2.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }

  .title {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    font-size: 74px;
    font-size: min(20vw, 118px);
    line-height: 1.06;
    letter-spacing: -0.02em;
    font-weight: 900;
  }

  /* 默认用实心金色，任何浏览器（含 QQ 内置 X5 内核）都能看见 */
  .w {
    display: inline-block;
    margin: 0 1px;
    color: #ffd76a;
    filter:
      drop-shadow(0 0 14px rgba(255,180,70,.55))
      drop-shadow(0 5px 0 rgba(120,28,10,.5));
    opacity: 0;
    transform: scale(.2) rotate(-28deg);
    transition:
      opacity .4s ease var(--d, 0s),
      transform .85s cubic-bezier(.16,.95,.3,1.3) var(--d, 0s);
  }
  body.play .w {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* 支持渐变文字时才升级成金属质感 + 流光 */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .w {
      background-image: linear-gradient(100deg,
        #ffe9a8 0%, #ffd05e 26%, #fffbe8 42%, #ffc247 58%, #ff9426 82%, #ffe9a8 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: shine 3.4s linear infinite;
    }
  }
  @keyframes shine {
    from { background-position: 0% 50%; }
    to   { background-position: 260% 50%; }
  }

  .en {
    margin: 14px 0 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .42em;
    text-indent: .42em;
    color: rgba(255,255,255,.68);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .8s ease .55s, transform .8s ease .55s;
  }
  .to {
    margin: 16px 0 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .08em;
    color: #ffd98a;
    text-shadow: 0 0 18px rgba(255,180,80,.55);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .8s ease .7s, transform .8s ease .7s;
  }
  .line {
    width: 128px;
    height: 1px;
    margin: 22px 0 0;
    background: linear-gradient(90deg, rgba(255,214,138,0), rgba(255,214,138,.85), rgba(255,214,138,0));
    opacity: 0;
    transition: opacity .9s ease .8s;
  }
  .wish {
    margin: 18px 0 0;
    max-width: 20em;
    font-size: 13.5px;
    line-height: 1.9;
    letter-spacing: .04em;
    color: rgba(255,255,255,.72);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .9s ease .9s, transform .9s ease .9s;
  }
  body.play .en,
  body.play .to,
  body.play .line,
  body.play .wish { opacity: 1; transform: none; }

  /* ---------------- 均衡器 / 播放状态 ---------------- */
  .eq {
    display: flex;
    align-items: flex-end;
    height: 18px;
    margin-top: 26px;
    opacity: 0;
    transition: opacity .5s ease 1s;
  }
  body.play .eq { opacity: 1; }
  .eq i {
    display: block;
    width: 3px;
    margin-right: 3px;
    border-radius: 2px;
    background: #ffd98a;
    animation: eq 1s ease-in-out infinite;
  }
  .eq i:nth-child(1) { height: 8px;  animation-delay: 0s; }
  .eq i:nth-child(2) { height: 16px; animation-delay: .18s; }
  .eq i:nth-child(3) { height: 11px; animation-delay: .36s; }
  .eq i:nth-child(4) { height: 15px; animation-delay: .52s; }
  @keyframes eq {
    0%, 100% { transform: scaleY(.35); opacity: .55; }
    50%      { transform: scaleY(1);   opacity: 1; }
  }

  /* ---------------- 重播 ---------------- */
  .replay {
    position: absolute;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(12px);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border: 1px solid rgba(255,214,138,.45);
    border-radius: 999px;
    background: rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #ffe0a3;
    font-size: 13.5px;
    letter-spacing: .06em;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
    z-index: 5;
  }
  .replay.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .replay:active { transform: translateX(-50%) scale(.96); }

  /* ---------------- 开场门 ---------------- */
  #gate {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: radial-gradient(circle at 50% 42%, rgba(72,22,92,.94) 0%, rgba(14,7,26,.98) 68%);
    transition: opacity .55s ease, transform .55s ease, visibility .55s;
    cursor: pointer;
  }
  #gate.hide {
    opacity: 0;
    transform: scale(1.12);
    visibility: hidden;
    pointer-events: none;
  }
  .gift {
    font-size: 74px;
    line-height: 1;
    filter: drop-shadow(0 12px 30px rgba(255,160,60,.45));
    animation: bob 2.2s ease-in-out infinite;
  }
  .gate-title {
    margin: 20px 0 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .14em;
    text-indent: .14em;
    color: #ffcf5c;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .gate-title {
      background-image: linear-gradient(100deg, #ffe9a8, #ffcf5c 45%, #ff9a2e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
  }
  .gate-sub {
    margin: 10px 0 0;
    font-size: 12.5px;
    letter-spacing: .16em;
    text-indent: .16em;
    color: rgba(255,255,255,.55);
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: .45; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div id="balloons"></div>
  <canvas id="fx"></canvas>

  <main class="card">
    <div class="cake">🎂</div>
    <h1 class="title">
      <span class="w" style="--d:0.00s">生</span>
      <span class="w" style="--d:0.13s">日</span>
      <span class="w" style="--d:0.26s">快</span>
      <span class="w" style="--d:0.39s">乐</span>
    </h1>
    <p class="en">HAPPY BIRTHDAY</p>
    <p class="to" id="to" hidden></p>
    <div class="line"></div>
    <p class="wish" id="wish">愿所有的快乐、所有的幸福、所有的温馨、所有的好运，都永远围绕在你身边 ❤️</p>
    <div class="eq"><i></i><i></i><i></i><i></i></div>
  </main>

  <button class="replay" id="replay" type="button">🎵 再听一次</button>
</div>

<div id="gate">
  <div class="gift">🎁</div>
  <p class="gate-title">有一份生日祝福送给你</p>
  <p class="gate-sub">轻触屏幕开启 · 请打开声音</p>
</div>

<audio id="bgm" preload="auto" playsinline webkit-playsinline></audio>

  var audio = document.getElementById('bgm');
  var replayBtn = document.getElementById('replay');
  var gate = document.getElementById('gate');
  var srcReady = false;

  function ensureSrc() {
    if (srcReady) return;
    srcReady = true;
    try {
      var bin = atob(B64);
      var n = bin.length;
      var buf = new Uint8Array(n);
      for (var i = 0; i < n; i++) buf[i] = bin.charCodeAt(i);
      audio.src = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));
    } catch (e) {
      audio.src = 'data:audio/mpeg;base64,' + B64;
    }
    audio.load();
  }

  function playSong() {
    ensureSrc();
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () {
        /* 被拦截时不打扰用户，屏幕上已有提示 */
      });
    }
  }

  audio.addEventListener('ended', function () {
    replayBtn.classList.add('show');
  });
  audio.addEventListener('playing', function () {
    replayBtn.classList.remove('show');
  });

  /* =======================================================
     2. 名字（?name=小美  或  #小美）
     ======================================================= */
  function readName() {
    var q = location.search.replace(/^\?/, '');
    var map = {};
    q.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      map[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
    });
    var n = map.name || map.n || '';
    if (!n && location.hash.length > 1) {
      try { n = decodeURIComponent(location.hash.slice(1)); } catch (e) { n = location.hash.slice(1); }
    }
    return String(n || '').trim().slice(0, 12);
  }

  var who = readName();
  if (who) {
    var to = document.getElementById('to');
    to.textContent = '献给 ' + who;
    to.hidden = false;
    document.getElementById('wish').textContent =
      who + '，愿所有的快乐、所有的幸福、所有的温馨、所有的好运，都永远围绕在你身边 ❤️';
  }

     3. 气球
     ======================================================= */
  var COLORS = ['#ff5c8a', '#ffd166', '#6be3ff', '#b18cff', '#7ef0a5', '#ff8f5a'];
  (function makeBalloons() {
    var box = document.getElementById('balloons');
    for (var i = 0; i < 6; i++) {
      var b = document.createElement('div');
      b.className = 'balloon';
      var w = 42 + Math.random() * 26;
      b.style.width = w + 'px';
      b.style.height = (w * 1.22) + 'px';
      b.style.left = (4 + i * 16 + Math.random() * 8) + 'vw';
      b.style.background = COLORS[i % COLORS.length];
      b.style.animationDuration = (13 + Math.random() * 8) + 's';
      b.style.animationDelay = (-Math.random() * 16) + 's';
      b.style.opacity = '0';
      box.appendChild(b);
    }
  })();

  /* =======================================================
     4. 彩纸粒子
     ======================================================= */
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var parts = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  function Particle(x, y, burst) {
    this.x = x;
    this.y = y;
    this.w = 4 + Math.random() * 6;
    this.h = 7 + Math.random() * 8;
    this.color = COLORS[(Math.random() * COLORS.length) | 0];
    this.rot = Math.random() * Math.PI * 2;
    this.vr = (Math.random() - 0.5) * 0.22;
    this.sway = Math.random() * Math.PI * 2;
    this.swaySpeed = 0.02 + Math.random() * 0.05;
    this.swayAmp = 0.4 + Math.random() * 1.1;
    if (burst) {
      var a = Math.random() * Math.PI * 2;
      var sp = 2 + Math.random() * 7;
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp - 4;
      this.g = 0.16;
      this.life = 1;
      this.decay = 0.008 + Math.random() * 0.01;
    } else {
      this.vx = 0;
      this.vy = 0.7 + Math.random() * 1.5;
      this.g = 0.004;
      this.life = 1;
      this.decay = 0;
    }
  }

  Particle.prototype.step = function () {
    this.vy += this.g;
    this.sway += this.swaySpeed;
    this.x += this.vx + Math.sin(this.sway) * this.swayAmp * (this.decay ? 0.15 : 1);
    this.y += this.vy;
    this.rot += this.vr;
    if (this.decay) {
      this.life -= this.decay;
      this.vx *= 0.985;
      this.vy *= 0.985;
    }
  };

  Particle.prototype.draw = function () {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, this.life));
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    ctx.restore();
  };

  function seedFall(n) {
    for (var i = 0; i < n; i++) {
      var p = new Particle(Math.random() * W, Math.random() * H - H, false);
      parts.push(p);
    }
  }

  function burst(x, y, n) {
    for (var i = 0; i < n; i++) parts.push(new Particle(x, y, true));
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.step();
      p.draw();
      if (p.y > H + 40 || p.life <= 0 || p.x < -80 || p.x > W + 80) {
        parts.splice(i, 1);
        if (!p.decay) parts.push(new Particle(Math.random() * W, -30, false));
      }
    }
    requestAnimationFrame(loop);
  }

  seedFall(56);
  loop();

  /* =======================================================
     5. 开场
     ======================================================= */
  var started = false;

  function start() {
    if (started) return;
    started = true;

    gate.classList.add('hide');
    document.body.classList.add('play');
    playSong();

    // 礼花
    burst(W / 2, H * 0.42, 90);
    setTimeout(function () { burst(W * 0.2, H * 0.3, 45); }, 260);
    setTimeout(function () { burst(W * 0.8, H * 0.32, 45); }, 420);
    setTimeout(function () { burst(W * 0.5, H * 0.25, 50); }, 700);

    if (navigator.vibrate) {
      try { navigator.vibrate(30); } catch (e) {}
    }
  }

  gate.addEventListener('click', start);
  gate.addEventListener('touchstart', function (e) { e.preventDefault(); start(); }, { passive: false });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') start();
  });

  replayBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    try { audio.currentTime = 0; } catch (err) {}
    playSong();
    burst(W / 2, H * 0.45, 50);
  });

  // 兜底：桌面浏览器 / 已经允许自动播放的场景可以去掉门
  setTimeout(function () {
    if (!started && !('ontouchstart' in window)) {
      // 桌面端仍然保留门，方便看清动画节奏
    }
  }, 100);
})();
</script>
</body>
</html>
